

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solução Direta</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #183153;
      background: linear-gradient(135deg, #eaf5ff, #f8fbff);
      display: flex;
      justify-content: center;
      padding: 24px 14px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      align-self: flex-start;
      background: white;
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 8px 30px #17385c18;
    }

    h1 {
      text-align: center;
      color: #1769aa;
      margin-top: 0;
    }

    .subtitulo {
      text-align: center;
      color: #52677d;
      line-height: 1.6;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      padding: 15px;
      border: 2px solid #c9dced;
      border-radius: 12px;
      font: inherit;
      font-size: 16px;
      outline-color: #2785d0;
    }

    .botoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      padding: 14px 10px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: #1769aa;
    }

    button:hover {
      filter: brightness(0.92);
    }

    button:focus-visible {
      outline: 3px solid #ffbd45;
      outline-offset: 3px;
    }

    .microfone {
      background: #16845b;
    }

    .parar {
      background: #b93838;
    }

    .audio {
      background: #6746a5;
    }

    #status {
      color: #52677d;
      min-height: 24px;
      margin: 16px 0;
    }

    #resultado {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: #f0f7ff;
      border-left: 5px solid #2785d0;
      border-radius: 10px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    #resultado h2 {
      color: #1769aa;
      margin-top: 0;
    }

    .dica {
      color: #52677d;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 20px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 20px 15px;
      }

      .botoes {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>💡 Solução Direta</h1>

    <p class="subtitulo">
      Escreva ou fale comigo. Vamos organizar suas ideias
      e encontrar possíveis caminhos para seguir.
    </p>

    <label for="mensagem"><strong>Sua mensagem:</strong></label>

    <textarea
      id="mensagem"
      placeholder="Escreva aqui ou clique em Falar para usar o microfone..."
    ></textarea>

    <div class="botoes">
      <button id="responder">💬 Responder</button>
      <button id="microfone" class="microfone">🎤 Falar</button>
      <button id="ouvir" class="audio">🔊 Ouvir resposta</button>
      <button id="parar" class="parar">⏹ Parar áudio</button>
    </div>

    <p id="status" role="status" aria-live="polite">
      Pronto para conversar!
    </p>

    <section id="resultado" aria-live="polite"></section>

    <p class="dica">
      O microfone pode exigir permissão do navegador.
      Este assistente usa respostas automáticas e não substitui
      orientação profissional em situações importantes.
    </p>
  </main>

  <script>
    const campo = document.getElementById("mensagem");
    const botaoResponder = document.getElementById("responder");
    const botaoMicrofone = document.getElementById("microfone");
    const botaoOuvir = document.getElementById("ouvir");
    const botaoParar = document.getElementById("parar");
    const statusTexto = document.getElementById("status");
    const resultado = document.getElementById("resultado");

    let ultimaResposta = "";
    let reconhecimento = null;
    let ouvindoMicrofone = false;

    function normalizar(texto) {
      return texto
        .toLocaleLowerCase("pt-BR")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^\p{L}\p{N}\s]/gu, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function mostrarResposta(titulo, mensagem, passos = []) {
      resultado.replaceChildren();

      const h2 = document.createElement("h2");
      h2.textContent = titulo;
      resultado.appendChild(h2);

      const p = document.createElement("p");
      p.textContent = mensagem;
      resultado.appendChild(p);

      if (passos.length > 0) {
        const lista = document.createElement("ul");

        passos.forEach(function(passo) {
          const item = document.createElement("li");
          item.textContent = passo;
          lista.appendChild(item);
        });

        resultado.appendChild(lista);
      }

      resultado.style.display = "block";

      ultimaResposta = titulo + ". " + mensagem + " " +
        passos.join(". ");

      statusTexto.textContent = "Resposta pronta!";

      resultado.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    }

    function gerarSolucao() {
      const mensagem = campo.value.trim();

      if (!mensagem) {
        statusTexto.textContent =
          "Digite ou fale alguma coisa primeiro.";
        campo.focus();
        return;
      }

      const texto = normalizar(mensagem);

      if (/^(oi|ola|opa|oie|e ai|eai)$/.test(texto)) {
        mostrarResposta(
          "Olá! 👋",
          "Que bom conversar com você! Como posso ajudar hoje?",
          [
            "Conte algo que aconteceu com você.",
            "Faça uma pergunta.",
            "Peça ideias para organizar suas tarefas."
          ]
        );
        return;
      }

      if (/^(tudo bem|como vai|como voce esta|como voce ta)$/.test(texto)) {
        mostrarResposta(
          "Tudo bem por aqui! 😊",
          "Obrigado por perguntar. Estou pronto para ajudar você. E você, como está?"
        );
        return;
      }

      if (/^(bom dia|boa tarde|boa noite)$/.test(texto)) {
        mostrarResposta(
          "Olá! ☀️",
          mensagem + "! Seja bem-vindo ao Solução Direta. O que você gostaria de conversar hoje?"
        );
        return;
      }

      if (/^(obrigado|obrigada|valeu|muito obrigado|muito obrigada)$/.test(texto)) {
        mostrarResposta(
          "Por nada! 💙",
          "Fico feliz em ajudar. Pode voltar sempre que quiser conversar."
        );
        return;
      }

      if (/^(tchau|ate logo|ate mais|adeus|falou)$/.test(texto)) {
        mostrarResposta(
          "Até mais! 👋",
          "Obrigado por conversar comigo. Espero que seu dia seja bom!"
        );
        return;
      }

      if (/^(quem e voce|o que voce faz|como voce funciona)$/.test(texto)) {
        mostrarResposta(
          "Sobre o Solução Direta 💡",
          "Sou um assistente simples que organiza mensagens e oferece sugestões preparadas para ajudar você a pensar nos próximos passos.",
          [
            "Você pode escrever ou falar.",
            "Posso apresentar sugestões gerais.",
            "Você pode ouvir minha resposta usando o botão de áudio."
          ]
        );
        return;
      }

      if (
        texto.includes("triste") ||
        texto.includes("desanimado") ||
        texto.includes("ansioso") ||
        texto.includes("preocupado")
      ) {
        mostrarResposta(
          "Vamos com calma 💙",
          "Parece que isso está pesando para você. Não preciso que resolva tudo de uma vez.",
          [
            "Tente identificar o que mais está incomodando.",
            "Escolha uma pequena coisa que possa ajudar agora.",
            "Se quiser, conte mais detalhes para organizar suas ideias."
          ]
        );
        return;
      }

      if (
        texto.includes("trabalho") ||
        texto.includes("emprego") ||
        texto.includes("estudar") ||
        texto.includes("estudo")
      ) {
        mostrarResposta(
          "Vamos organizar seu objetivo 📚",
          "Podemos dividir sua situação em partes menores para encontrar um caminho possível.",
          [
            "Defina o que você quer alcançar.",
            "Identifique a principal dificuldade.",
            "Escolha uma ação pequena para começar."
          ]
        );
        return;
      }

      if (
        texto.includes("problema") ||
        texto.includes("resolver") ||
        texto.includes("dificuldade") ||
        texto.includes("ajuda")
      ) {
        mostrarResposta(
          "Vamos pensar em uma solução 💡",
          "Para começar, é útil entender o que está acontecendo e o que você gostaria que fosse diferente.",
          [
            "Descreva o problema em uma frase.",
            "Separe o que você pode controlar do que não pode.",
            "Pense em duas possíveis ações.",
            "Escolha a opção mais simples e segura para começar."
          ]
        );
        return;
      }

      mostrarResposta(
        "Obrigado por compartilhar! 💬",
        "Recebi sua mensagem: " + mensagem +
        ". Ainda não consigo compreender perfeitamente qualquer assunto, mas posso ajudar você a organizar essa ideia.",
        [
          "Explique o que aconteceu.",
          "Diga qual resultado você gostaria de alcançar.",
          "Pergunte algo mais específico para receber sugestões melhores."
        ]
      );
    }

    function pararAudio() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      statusTexto.textContent = "Áudio parado.";
    }

    function ouvirResposta() {
      if (!ultimaResposta) {
        statusTexto.textContent =
          "Primeiro escreva uma mensagem e clique em Responder.";
        return;
      }

      if (!("speechSynthesis" in window)) {
        statusTexto.textContent =
          "Seu navegador não oferece leitura de voz. Tente usar o Chrome.";
        return;
      }

      window.speechSynthesis.cancel();

      const fala = new SpeechSynthesisUtterance(ultimaResposta);
      fala.lang = "pt-BR";
      fala.rate = 1;
      fala.pitch = 1;

      fala.onstart = function() {
        statusTexto.textContent = "Lendo a resposta em voz alta...";
      };

      fala.onend = function() {
        statusTexto.textContent = "Leitura concluída.";
      };

      fala.onerror = function() {
        statusTexto.textContent =
          "Não foi possível reproduzir a voz neste momento.";
      };

      window.speechSynthesis.speak(fala);
    }

    function configurarMicrofone() {
      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        statusTexto.textContent =
          "O reconhecimento de voz não está disponível neste navegador. Use o Chrome atualizado ou digite sua mensagem.";
        return;
      }

      if (ouvindoMicrofone && reconhecimento) {
        reconhecimento.stop();
        return;
      }

      reconhecimento = new SpeechRecognition();
      reconhecimento.lang = "pt-BR";
      reconhecimento.continuous = false;
      reconhecimento.interimResults = false;
      ouvindoMicrofone = true;

      reconhecimento.onstart = function() {
        statusTexto.textContent = "Pode falar. Estou ouvindo...";
        botaoMicrofone.textContent = "🎤 Ouvindo...";
      };

      reconhecimento.onresult = function(event) {
        const transcricao = event.results[0][0].transcript;
        campo.value = transcricao;
        statusTexto.textContent = "Voz reconhecida. Preparando resposta...";
        gerarSolucao();
      };

      reconhecimento.onerror = function(event) {
        const erros = {
          "not-allowed": "Permita o acesso ao microfone nas configurações do navegador.",
          "no-speech": "Não ouvi sua voz. Tente falar novamente.",
          "audio-capture": "Não encontrei um microfone disponível.",
          "network": "O reconhecimento de voz falhou por um problema de rede."
        };

        statusTexto.textContent =
          erros[event.error] || "O microfone não funcionou. Tente novamente.";
      };

      reconhecimento.onend = function() {
        ouvindoMicrofone = false;
        botaoMicrofone.textContent = "🎤 Falar";
      };

      try {
        reconhecimento.start();
      } catch (erro) {
        ouvindoMicrofone = false;
        botaoMicrofone.textContent = "🎤 Falar";
        statusTexto.textContent =
          "Não consegui iniciar o microfone. Tente novamente.";
      }
    }

    botaoResponder.addEventListener("click", gerarSolucao);
    botaoMicrofone.addEventListener("click", configurarMicrofone);
    botaoOuvir.addEventListener("click", ouvirResposta);
    botaoParar.addEventListener("click", pararAudio);

    campo.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        gerarSolucao();
      }
    });
  </script>
</body>
</html>
